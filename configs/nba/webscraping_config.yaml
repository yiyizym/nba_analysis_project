# Web scraping configuration

# Game date spelled in different ways in each stat_type table
game_date_header_variations:
  - Game Date
  - Game_Date
  - GAME DATE
  - "Game\xa0Date"

# Scraping settings
full_scrape: False
start_season: 2006
off_season_start_month: 8
regular_season_start_month: 10
play_in_month: 4

# Validation settings
enable_validation_scraping: False # Set to False to skip validation data collection
validation_data_file: validation_data.csv  # File to store validation data from basketball-reference.com
team_mapping_file: team_mapping.yaml  # Team ID to abbreviation mapping for basketball-reference.com

# Team stats settings
enable_team_stats_scraping: False # Set to True to enable team stats collection
team_stats_category: shooting # Legacy: single category mode (for backwards compatibility)

# Team stats categories configuration
# Each group can be enabled/disabled independently
# Categories with extra_params will be scraped multiple times with different URL parameters
team_stats_categories:
  # Traditional Stats Group
  traditional_stats:
    enabled: true
    categories:
      - name: traditional
      - name: advanced
      - name: four-factors
      - name: misc
      - name: scoring
      - name: opponent
      - name: defense
      - name: estimated-advanced

  # Clutch Stats Group
  clutch_stats:
    enabled: true
    categories:
      - name: clutch-traditional
      - name: clutch-advanced
      - name: clutch-four-factors
      - name: clutch-misc
      - name: clutch-scoring
      - name: clutch-opponent

  # Playtype Stats Group
  playtype_stats:
    enabled: true
    categories:
      - name: isolation
      - name: transition
      - name: ball-handler
      - name: roll-man
      - name: post-up
      - name: spot-up
      - name: hand-off
      - name: cut
      - name: off-screen
      - name: putbacks

  # Tracking Stats Group
  tracking_stats:
    enabled: true
    categories:
      - name: drives
      - name: defensive-impact
      - name: catch-shoot
      - name: passing
      - name: touches
      - name: pullup
      - name: rebounding
      - name: speed-distance
      - name: elbow-touches
      - name: post-touches
      - name: paint-touches

  # Defense Dashboard Group
  defense_dashboard:
    enabled: true
    categories:
      - name: defense-dash-overall
      - name: defense-dash-3pt
      - name: defense-dash-2pt
      - name: defense-dash-lt6
      - name: defense-dash-lt10
      - name: defense-dash-gt15

  # Shot Dashboard Group
  shot_dashboard:
    enabled: true
    categories:
      - name: shots-general
      - name: shots-shotclock
      - name: shots-dribbles
      - name: shots-touch-time
      - name: shots-closest-defender
      - name: shots-closest-defender-10

  # Shooting Stats Group (with DistanceRange parameter support)
  shooting_stats:
    enabled: true
    categories:
      - name: shooting
        extra_params:
          - DistanceRange: "By+Zone"
          - DistanceRange: "5ft+Range"
          - DistanceRange: "8ft+Range"
      - name: opponent-shooting
        extra_params:
          - DistanceRange: "By+Zone"
          - DistanceRange: "5ft+Range"
          - DistanceRange: "8ft+Range"

  # Hustle Stats Group
  hustle_stats:
    enabled: true
    categories:
      - name: hustle
      - name: box-outs

# NBA URLs
nba_boxscores_url: https://www.nba.com/stats/teams/boxscores
nba_schedule_url: https://www.nba.com/schedule

# Season types
regular_season_text: Regular+Season
play_in_season_text: PlayIn
playoffs_season_text: Playoffs

# Stat types to scrape
stat_types:
  - traditional
  - advanced
  - four-factors
  - misc
  - scoring

# CSS class names for scraping
table_class_name: Crom_table__p1iZz
pagination_class_name: Pagination_pageDropdown__KgjBU
dropdown_class_name: DropDown_select__4pIg9
teams_and_games_class_name: Anchor_anchor__cSc3P
games_per_day_class_name: ScheduleDay_sdGames__NGdO5
day_class_name: ScheduleDay_sdDay__3s2Xt
teams_links_class_name: Anchor_anchor__cSc3P Link_styled__okbXW 
game_links_class_name: Anchor_anchor__cSc3P TabLink_link__f_15h
no_data_class_name: NoDataMessage_base__xUA61  # a message appears if there is no data for the parameters being searched for

# Text to find links that contain game ids
schedule_preview_text: PREVIEW

# Schedule scraper column names - 
# these are the columns created when converting lists to dataframes for todays_matchups_file and todays_games_ids_file
schedule_home_team_id_column: home_id
schedule_visitor_team_id_column: visitor_id
schedule_game_id_column: game_id

# Timeout settings if page or dynamic content (tables) take too long to load
page_load_timeout: 30
dynamic_content_timeout: 30 

# Retry settings
max_retries: 2
retry_delay: 2
wait_time: 10


# Browser options (first is the default, second is the fallback)
browsers:
  - chrome
  - firefox

  # Chrome-specific options
chrome_options:
  --headless: null  # Old Chromium doesn't support --headless=new
  --no-sandbox: null
  --disable-dev-shm-usage: null
  --disable-gpu: null
  --disable-software-rasterizer: null  # Required for GitHub Actions
  --disable-setuid-sandbox: null  # Required for containerized environments
  --disable-extensions: null
  --disable-popup-blocking: null
  --disable-notifications: null
  --disable-3d-apis: null
  --disable-blink-features=AutomationControlled: null
  --window-size=1920,1080: null  # Better than start-maximized for headless
  --user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36"



# Firefox-specific options
firefox_options:
  --headless: null
  --disable-blink-features=AutomationControlled: null
  --user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:53.0) Gecko/20100101 Firefox/53.0"

# Per-team stats scraping configuration
# Scrapes individual team pages with dimension filters (Month, LastNGames, etc.)
per_team_stats:
  enabled: false  # Master switch for per-team scraping

  # Team scope: "all" for all 30 NBA teams, or list of specific team IDs
  # Team IDs are loaded from team_mapping.yaml when "all" is specified
  teams: all  # Options: "all" | ["1610612737", "1610612738", ...]

  # Rate limiting to avoid IP blocking
  rate_limiting:
    delay_between_requests: 2.0  # seconds between each page request
    delay_between_teams: 5.0     # seconds between switching teams
    max_retries: 3               # max retries on error
    retry_base_delay: 2          # base delay for exponential backoff

  # Dimension parameters to scrape
  # Each enabled dimension creates additional data variations
  # NBA.com Month mapping: 0=All, 1=Oct, 2=Nov, 3=Dec, 4=Jan, 5=Feb, 6=Mar, 7=Apr, 8=May, 9=Jun
  dimensions:
    Month:
      enabled: false  # Disable by default to reduce request volume
      values:
        - "0"   # All months

    LastNGames:
      enabled: false
      values:
        - "0"   # All games
        - "5"   # Last 5 games
        - "10"  # Last 10 games

    Location:
      enabled: false
      values:
        - ""      # All locations
        - "Home"
        - "Road"

    Outcome:
      enabled: false
      values:
        - ""   # All outcomes
        - "W"  # Wins only
        - "L"  # Losses only

    DaysRest:
      enabled: false
      values:
        - ""    # All
        - "0"   # Back-to-back
        - "1"   # 1 day rest
        - "2+"  # 2+ days rest

  # Categories to scrape for per-team mode
  # If empty list, uses enabled categories from team_stats_categories above
  # If specified, only these categories will be scraped
  categories: []  # Empty = use existing enabled categories
